name: Inspect Memphis systemd drop-ins safely

on:
  push:
    branches:
      - ops/auto-deploy-main-2026-11-15
    paths:
      - .github/workflows/inspect-memphis-dropins.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read systemd override directives without exposing environment values
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"

          KEY_FILE="$RUNNER_TEMP/memphis-key"
          HOSTS_FILE="$RUNNER_TEMP/memphis-known-hosts"
          trap 'rm -f "$KEY_FILE" "$HOSTS_FILE"' EXIT
          printf '%s' "$DEPLOY_SSH_KEY" | base64 --decode > "$KEY_FILE"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOSTS_FILE"
          chmod 600 "$KEY_FILE" "$HOSTS_FILE"

          ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOSTS_FILE" \
            -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo "=== Unit properties ==="
          systemctl show memphis-lspd.service --no-pager \
            --property=FragmentPath --property=DropInPaths \
            --property=User --property=Group --property=WorkingDirectory \
            --property=ExecStart --property=EnvironmentFiles

          echo "=== Drop-in directives (environment values redacted) ==="
          for file in /etc/systemd/system/memphis-lspd.service.d/*.conf; do
            [ -f "$file" ] || continue
            echo "--- $(basename "$file") ---"
            awk '
              /^[[:space:]]*($|#|;|\[)/ { print; next }
              {
                key=$0
                sub(/[[:space:]]*=.*/, "", key)
                value=$0
                sub(/^[^=]*=[[:space:]]*/, "", value)
                if (key == "Environment" || key == "EnvironmentFile" ||
                    key == "SetCredential" || key == "LoadCredential") {
                  print key "=<redacted>"
                } else {
                  print key "=" value
                }
              }
            ' "$file"
          done

          echo "=== Base unit directives (environment values redacted) ==="
          awk '
            /^[[:space:]]*($|#|;|\[)/ { print; next }
            {
              key=$0
              sub(/[[:space:]]*=.*/, "", key)
              value=$0
              sub(/^[^=]*=[[:space:]]*/, "", value)
              if (key == "Environment" || key == "EnvironmentFile" ||
                  key == "SetCredential" || key == "LoadCredential") {
                print key "=<redacted>"
              } else {
                print key "=" value
              }
            }
          ' /etc/systemd/system/memphis-lspd.service
          REMOTE
