name: Build and deploy Las Vegas

on:
  push:
    branches:
      - main
    paths:
      - "las-vegas/**"
      - ".github/workflows/deploy-las-vegas.yml"
  pull_request:
    branches:
      - main
    paths:
      - "las-vegas/**"
      - ".github/workflows/deploy-las-vegas.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy Las Vegas to the VPS (requires the isolated LV server helper to be provisioned)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: las-vegas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Install and build Las Vegas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: las-vegas/package-lock.json

      - name: Install Las Vegas dependencies
        working-directory: las-vegas
        run: npm ci --no-audit --no-fund

      - name: Build Las Vegas standalone app
        working-directory: las-vegas
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Assemble isolated Las Vegas release archive
        shell: bash
        working-directory: las-vegas
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          test -f .next/BUILD_ID

          release="$RUNNER_TEMP/las-vegas-release"
          mkdir -p "$release/.next"
          cp -a .next/standalone/. "$release/"
          mkdir -p "$release/.next/static"
          if [ -d .next/static ]; then
            cp -a .next/static/. "$release/.next/static/"
          fi
          if [ -d public ]; then
            mkdir -p "$release/public"
            cp -a public/. "$release/public/"
          fi

          tar -czf "$RUNNER_TEMP/las-vegas-$GITHUB_SHA.tar.gz" -C "$release" .
          test -s "$RUNNER_TEMP/las-vegas-$GITHUB_SHA.tar.gz"

      - name: Upload Las Vegas release artifact
        uses: actions/upload-artifact@v4
        with:
          name: las-vegas-${{ github.sha }}
          path: ${{ runner.temp }}/las-vegas-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy isolated Las Vegas service
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Las Vegas release artifact
        uses: actions/download-artifact@v4
        with:
          name: las-vegas-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Upload and activate Las Vegas release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_BASE_URL: https://suspect-famq.ru
        run: |
          set -euo pipefail
          umask 077

          : "${DEPLOY_HOST:?GitHub Secret DEPLOY_HOST is missing or empty}"
          : "${DEPLOY_USER:?GitHub Secret DEPLOY_USER is missing or empty}"
          : "${DEPLOY_SSH_KEY:?GitHub Secret DEPLOY_SSH_KEY is missing or empty}"
          : "${DEPLOY_KNOWN_HOSTS:?GitHub Secret DEPLOY_KNOWN_HOSTS is missing or empty}"

          key_file="$RUNNER_TEMP/las-vegas-deploy-key"
          hosts_file="$RUNNER_TEMP/las-vegas-known-hosts"
          archive="$RUNNER_TEMP/release/las-vegas-$GITHUB_SHA.tar.gz"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT

          printf '%s' "$DEPLOY_SSH_KEY" | base64 --decode > "$key_file"
          printf '%s\\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\\r' > "$hosts_file"
          chmod 600 "$key_file" "$hosts_file"
          test -s "$archive"
          ssh-keygen -y -f "$key_file" >/dev/null

          ssh_opts=(
            -i "$key_file"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$hosts_file"
            -o ConnectTimeout=10
          )

          # Separate helper and state directory; Memphis deploy is never called.
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            sudo -n /usr/local/sbin/las-vegas-deploy --check

          scp "${ssh_opts[@]}" "$archive" \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/lib/las-vegas-deploy/incoming/$GITHUB_SHA.tar.gz"

          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            sudo -n /usr/local/sbin/las-vegas-deploy "$GITHUB_SHA"

          if ! curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 2 --retry-all-errors --max-time 25 \
              "$DEPLOY_BASE_URL/las-vegas/start" -o /dev/null; then
            echo "::error::Public Las Vegas health check failed; requesting LV-only rollback."
            ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              sudo -n /usr/local/sbin/las-vegas-deploy --rollback || \
              echo "::error::LV rollback command failed; inspect the Las Vegas service."
            exit 1
          fi

          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            sudo -n /usr/local/sbin/las-vegas-deploy --commit "$GITHUB_SHA"

          echo "Las Vegas deployment $GITHUB_SHA passed its public route health check."
