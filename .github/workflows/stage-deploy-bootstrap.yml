name: Stage automatic deployment installer on VPS
on:
  push:
    branches:
      - ops/auto-deploy-main-2026-11-15
    paths:
      - scripts/memphis-deploy
      - scripts/install-memphis-deploy.sh
      - .github/workflows/stage-deploy-bootstrap.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memphis-deploy-bootstrap-transfer
  cancel-in-progress: false
jobs:
  stage-installer:
    name: Upload installer into VPS incoming directory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Upload root-owned installer sources for one-time setup
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          : "${DEPLOY_HOST:?GitHub Secret DEPLOY_HOST is missing or empty}"
          : "${DEPLOY_USER:?GitHub Secret DEPLOY_USER is missing or empty}"
          : "${DEPLOY_SSH_KEY:?GitHub Secret DEPLOY_SSH_KEY is missing or empty}"
          : "${DEPLOY_KNOWN_HOSTS:?GitHub Secret DEPLOY_KNOWN_HOSTS is missing or empty}"
          KEY_FILE="$RUNNER_TEMP/memphis-deploy-key"
          HOSTS_FILE="$RUNNER_TEMP/memphis-known-hosts"
          trap 'rm -f "$KEY_FILE" "$HOSTS_FILE"' EXIT
          printf '%s' "$DEPLOY_SSH_KEY" | base64 --decode > "$KEY_FILE"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOSTS_FILE"
          chmod 600 "$KEY_FILE" "$HOSTS_FILE"
          ssh-keygen -y -f "$KEY_FILE" >/dev/null
          ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOSTS_FILE" -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" 'set -eu; mkdir -p /var/lib/memphis-deploy/incoming/bootstrap; chmod 700 /var/lib/memphis-deploy/incoming/bootstrap'
          scp -i "$KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOSTS_FILE" -o ConnectTimeout=10 scripts/memphis-deploy scripts/install-memphis-deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/var/lib/memphis-deploy/incoming/bootstrap/"
          ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOSTS_FILE" -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" 'set -eu; test -s /var/lib/memphis-deploy/incoming/bootstrap/memphis-deploy; test -s /var/lib/memphis-deploy/incoming/bootstrap/install-memphis-deploy.sh; chmod 600 /var/lib/memphis-deploy/incoming/bootstrap/*; echo "Installer files staged successfully."'
