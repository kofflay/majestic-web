name: CI

# Pull-request validation for the current application source.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh scripts/memphis-deploy; do
            bash -n "$script"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
